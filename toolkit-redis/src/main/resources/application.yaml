spring:
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
#      password:
      timeout: 60000
      lettuce:
        # lettuce连接池配置
        pool:
          # 最小空闲连接数
          min-idle: 0
          # 最大空闲连接数
          max-idle: 8
          # 最大活跃连接数
          max-active: 8
          # 从连接池获取连接时的最大超时时间，小于等于0则表示不会超时
          max-wait: -1
